<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f3554">
  <title>Verarbeitungs-Aufträge – Herz-Kreislauf-System</title>
  <style>
    :root {
      --navy: #0f3554;
      --blue: #176c9e;
      --red: #c93c35;
      --green: #196b2c;
      --green-soft: #e8f6eb;
      --ink: #18232d;
      --muted: #5c6872;
      --line: #d7dee3;
      --paper: #ffffff;
      --ground: #f2f5f7;
      --good: #147a42;
      --bad: #ba2f2f;
      --shadow: 0 10px 34px rgba(15, 53, 84, .10);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--ground);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.55;
    }

    button, select, textarea { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      color: white;
      background: linear-gradient(118deg, var(--navy), #164d74 65%, #126b7d);
      box-shadow: 0 5px 20px rgba(15, 53, 84, .18);
    }

    .masthead {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 14px 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .masthead h1 { margin: 0; font-size: clamp(1.05rem, 2.1vw, 1.45rem); letter-spacing: -.01em; }
    .masthead p { margin: 1px 0 0; opacity: .78; font-size: .82rem; }
    .progress-wrap { min-width: 175px; text-align: right; }
    .progress-wrap span { display: block; font-size: .76rem; margin-bottom: 4px; }
    .progress-track { height: 7px; background: rgba(255,255,255,.22); border-radius: 999px; overflow: hidden; }
    .progress-bar { height: 100%; width: 0; background: #8ee6b0; transition: width .25s ease; }

    .tabs {
      width: min(1120px, 100%);
      margin: 0 auto;
      display: flex;
      overflow-x: auto;
      scrollbar-width: thin;
      padding: 0 16px;
    }

    .tab {
      flex: 0 0 auto;
      border: 0;
      border-bottom: 4px solid transparent;
      background: transparent;
      color: rgba(255,255,255,.78);
      padding: 11px 15px 10px;
      cursor: pointer;
      font-weight: 650;
    }
    .tab:hover { color: white; background: rgba(255,255,255,.07); }
    .tab.active { color: white; border-bottom-color: #8ee6b0; background: rgba(255,255,255,.09); }

    main { width: min(980px, calc(100% - 28px)); margin: 28px auto 52px; }
    .page { display: none; animation: appear .22s ease-out; }
    .page.active { display: block; }
    @keyframes appear { from { opacity: .2; transform: translateY(5px); } }

    .hero-card, .card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .hero-card { padding: clamp(22px, 4vw, 40px); margin-bottom: 22px; }
    .eyebrow { margin: 0 0 3px; color: var(--blue); font-weight: 750; font-size: .82rem; letter-spacing: .07em; text-transform: uppercase; }
    h2 { margin: 0; color: var(--navy); font-size: clamp(2rem, 5vw, 3.35rem); line-height: 1.05; letter-spacing: -.035em; }
    .byline { color: var(--muted); margin: 10px 0 0; }

    .resource-row {
      margin-top: 22px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .resource {
      display: block;
      color: var(--navy);
      text-decoration: none;
      background: #f6f9fb;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
    }
    .resource small { display: block; color: var(--muted); font-weight: 650; }
    .resource strong { color: var(--blue); text-decoration: underline; text-underline-offset: 3px; }
    .resource:hover { border-color: var(--blue); background: #f0f8fc; }

    .card { padding: clamp(18px, 3vw, 30px); margin-top: 22px; }
    .card h3 { margin: 0 0 10px; color: var(--navy); font-size: 1.35rem; }
    .instruction { margin: 0 0 18px; font-weight: 670; }
    .instruction a { color: var(--blue); }

    .topic-image {
      display: block;
      width: min(100%, 760px);
      height: auto;
      margin: 16px auto 0;
      border-radius: 12px;
      background: white;
    }
    .anatomy-image { width: min(100%, 790px); }

    .case {
      border: 1px solid #9bc6a2;
      border-radius: 13px;
      overflow: hidden;
      margin-top: 22px;
    }
    .case h3 { margin: 0; color: white; background: var(--green); padding: 8px 14px; font-size: 1.05rem; }
    .case p { margin: 0; padding: 15px; background: var(--green-soft); font-weight: 650; }

    .questions { margin-top: 18px; display: grid; gap: 15px; }
    .question {
      background: white;
      border: 1px solid var(--line);
      border-radius: 13px;
      padding: 15px;
    }
    .question label { display: block; font-weight: 700; margin-bottom: 9px; }
    textarea {
      display: block;
      width: 100%;
      min-height: 104px;
      resize: vertical;
      color: var(--ink);
      background: #fbfcfd;
      border: 1.5px solid #bac5cd;
      border-radius: 9px;
      padding: 11px 12px;
      outline: none;
    }
    textarea:focus { background: white; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(23,108,158,.12); }
    .autosave { margin: 14px 0 0; color: var(--muted); font-size: .86rem; }

    .export-panel {
      margin-top: 22px;
      padding: 18px;
      color: var(--ink);
      background: #edf4f8;
      border: 1px solid #cbdce6;
      border-radius: 13px;
    }
    .export-panel h3 { margin: 0 0 4px; font-size: 1.12rem; color: var(--navy); }
    .export-panel p { margin: 0; color: var(--muted); font-size: .9rem; }
    .export-panel .actions { margin-top: 13px; }

    .answer-grid {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px 14px;
    }
    .answer-row {
      display: grid;
      grid-template-columns: 38px 1fr;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fbfcfd;
      overflow: hidden;
    }
    .answer-row .number { align-self: stretch; display: grid; place-items: center; color: white; background: var(--navy); font-weight: 800; }
    .answer-row select { width: 100%; border: 0; background: transparent; padding: 10px; color: var(--ink); outline: none; }
    .answer-row.good { border: 2px solid var(--good); background: #edf9f1; }
    .answer-row.bad { border: 2px solid var(--bad); background: #fff1f1; }
    .answer-row.good .number { background: var(--good); }
    .answer-row.bad .number { background: var(--bad); }

    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 18px; }
    .button {
      border: 0;
      border-radius: 10px;
      padding: 10px 15px;
      cursor: pointer;
      font-weight: 720;
    }
    .button.primary { color: white; background: var(--navy); }
    .button.primary:hover { background: #184c72; }
    .button.secondary { color: var(--navy); background: #eaf0f4; }
    .button.secondary:hover { background: #dce7ee; }
    .result { min-height: 1.4em; font-weight: 750; }
    .result.perfect { color: var(--good); }
    .result.incomplete { color: var(--bad); }

    details.solution { margin-top: 14px; border: 1px solid var(--line); border-radius: 11px; background: #f8fafb; }
    details.solution summary { cursor: pointer; padding: 11px 14px; font-weight: 700; color: var(--navy); }
    details.solution img { padding: 0 12px 12px; width: 100%; height: auto; }

    .page-nav {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 24px;
    }
    .page-nav .button[disabled] { opacity: .35; cursor: default; }

    footer { color: var(--muted); text-align: center; font-size: .83rem; margin-top: 26px; }

    @media (max-width: 680px) {
      .masthead { width: calc(100% - 24px); }
      .progress-wrap { min-width: 120px; }
      .resource-row, .answer-grid { grid-template-columns: 1fr; }
      main { width: min(100% - 20px, 980px); margin-top: 16px; }
      .hero-card, .card { border-radius: 14px; }
      .tab { padding-inline: 12px; }
    }

    @media print {
      body { background: white; }
      .topbar, .page-nav, footer, .actions, details.solution { display: none !important; }
      main { width: 100%; margin: 0; }
      .page { display: none !important; }
      .page.active { display: block !important; }
      .hero-card, .card { box-shadow: none; border-color: #bbb; break-inside: avoid; }
      textarea { min-height: 115px; }
    }
  </style>
</head>

            <span>(Arterielle Hypertonie, Koronare Herzkrankheit, Herzinfarkt, Herzinsuffizienz)</span>
          </a>
          <a class="resource" href="${topic.video}" target="_blank" rel="noopener">
            <small>${topic.videoTime}</small>
            <strong>${topic.videoTitle}</strong>
          </a>
        </div>`}
      </header>`;
    }

    function questionBox(id, question) {
      return `<div class="question">
        <label for="${id}">${question}</label>
        <textarea id="${id}" data-text-answer="${id}" placeholder="Antwort hier eingeben …"></textarea>
      </div>`;
    }

    function standardPage(topic, index) {
      return `<section class="page" id="page-${topic.id}" data-topic="${topic.id}">
        ${hero(topic)}
        <article class="card">
          <img class="topic-image" src="${IMAGES[topic.image]}" alt="Symbolbild zum Thema ${topic.title}">
          <div class="case">
            <h3>Fallsituation</h3>
            <p>${topic.case}</p>
          </div>
          <div class="questions">
            ${topic.questions.map((q, i) => questionBox(`${topic.id}-${i + 1}`, q)).join('')}
          </div>
          <p class="autosave">Ihre Eingaben werden automatisch auf diesem Gerät gespeichert.</p>
        </article>
        ${exportPanel(topic)}
        ${navButtons(index)}
      </section>`;
    }

    function exportPanel(topic) {
      return `<section class="export-panel">
        <h3>Antworten speichern</h3>
        <p>Speichern Sie Ihre eingegebenen Antworten für dieses Thema als PDF oder Textdatei.</p>
        <div class="actions">
          <button class="button primary" type="button" data-export-pdf="${topic.id}">Als PDF speichern</button>
          <button class="button secondary" type="button" data-export-text="${topic.id}">Als Textdatei speichern</button>
        </div>
      </section>`;
    }

    function navButtons(index) {
      return `<nav class="page-nav" aria-label="Seitennavigation">
        <button class="button secondary" type="button" data-go="${index - 1}" ${index === 0 ? 'disabled' : ''}>Zurück</button>
        <button class="button primary" type="button" data-go="${index + 1}" ${index === topics.length - 1 ? 'disabled' : ''}>Nächstes Thema</button>
      </nav>`;
    }

    document.querySelector('.tabs').innerHTML = topics.map((t, i) =>
      `<button class="tab" type="button" data-tab="${i}">${t.tab}</button>`
    ).join('');
    document.getElementById('app').innerHTML = topics.map((t, i) => t.special ? anatomyPage(t, i) : standardPage(t, i)).join('') +
      '<footer>Verarbeitungs-Aufträge · Modul AGS zu FaGe</footer>';

    document.querySelectorAll('[data-text-answer]').forEach(el => {
      el.value = saved[el.dataset.textAnswer] || '';
      el.addEventListener('input', () => {
        saved[el.dataset.textAnswer] = el.value;
        save();
        updateProgress();
      });
    });

    document.querySelectorAll('[data-anatomy]').forEach(el => {
      el.value = saved[`anatomy-${el.dataset.anatomy}`] || '';
      el.addEventListener('change', () => {
        saved[`anatomy-${el.dataset.anatomy}`] = el.value;
        save();
        el.closest('.answer-row').classList.remove('good', 'bad');
        document.getElementById('anatomyResult').textContent = '';
        updateProgress();
      });
    });

    document.getElementById('checkAnatomy').addEventListener('click', () => {
      let correct = 0;
      document.querySelectorAll('[data-anatomy]').forEach((el, i) => {
        const ok = el.value === anatomyAnswers[i];
        const row = el.closest('.answer-row');
        row.classList.toggle('good', ok);
        row.classList.toggle('bad', !ok);
        if (ok) correct++;
      });
      const result = document.getElementById('anatomyResult');
      result.textContent = `${correct} von ${anatomyAnswers.length} richtig`;
      result.className = `result ${correct === anatomyAnswers.length ? 'perfect' : 'incomplete'}`;
      result.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });

    document.getElementById('resetAnatomy').addEventListener('click', () => {
      if (!confirm('Möchten Sie alle Eingaben der Anatomie-Aufgabe zurücksetzen?')) return;
      document.querySelectorAll('[data-anatomy]').forEach(el => {
        el.value = '';
        delete saved[`anatomy-${el.dataset.anatomy}`];
        el.closest('.answer-row').classList.remove('good', 'bad');
      });
      save();
      document.getElementById('anatomyResult').textContent = '';
      updateProgress();
    });

    let activeIndex = Math.max(0, topics.findIndex(t => t.id === location.hash.slice(1)));
    function showTopic(index) {
      if (index < 0 || index >= topics.length) return;
      activeIndex = index;
      document.querySelectorAll('.page').forEach((el, i) => el.classList.toggle('active', i === index));
      document.querySelectorAll('.tab').forEach((el, i) => {
        el.classList.toggle('active', i === index);
        el.setAttribute('aria-current', i === index ? 'page' : 'false');
      });
      history.replaceState(null, '', `#${topics[index].id}`);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.querySelectorAll('[data-tab]').forEach(el => el.addEventListener('click', () => showTopic(Number(el.dataset.tab))));
    document.querySelectorAll('[data-go]').forEach(el => el.addEventListener('click', () => showTopic(Number(el.dataset.go))));

    function plainText(value) {
      const temp = document.createElement('div');
      temp.innerHTML = value;
      return (temp.textContent || '').replace(/\s+/g, ' ').trim();
    }

    function safeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function exportData(topicId) {
      const topic = topics.find(t => t.id === topicId);
      if (topic.special) {
        const anatomy = anatomyAnswers.map((correct, i) => {
          const answer = document.querySelector(`[data-anatomy="${i}"]`).value;
          return {
            question: `Nummer ${i + 1}`,
            answer: answer || 'Keine Antwort eingegeben.',
            status: answer ? (answer === correct ? 'Richtig' : 'Falsch') : 'Nicht beantwortet'
          };
        });
        const conduction = document.querySelector('[data-text-answer="anatomie-reizleitung"]').value.trim();
        return {
          title: topic.title,
          entries: anatomy.concat([{
            question: 'Beschreiben Sie, wie die Herzreizleitung funktioniert. (Seite 16)',
            answer: conduction || 'Keine Antwort eingegeben.'
          }])
        };
      }

      return {
        title: topic.title,
        caseText: topic.case,
        entries: topic.questions.map((question, i) => {
          const answer = document.querySelector(`[data-text-answer="${topic.id}-${i + 1}"]`).value.trim();
          return { question: plainText(question), answer: answer || 'Keine Antwort eingegeben.' };
        })
      };
    }

    function printableHtml(data) {
      const entries = data.entries.map((entry, i) => `
        <section class="entry">
          <h2>${i + 1}. ${safeHtml(entry.question)}</h2>
          <p>${safeHtml(entry.answer).replaceAll('\n', '<br>')}</p>
          ${entry.status ? `<div class="status">Auswertung: ${safeHtml(entry.status)}</div>` : ''}
        </section>`).join('');
      return `<!doctype html><html lang="de-CH"><head><meta charset="utf-8"><title>${safeHtml(data.title)} – Antworten</title>
        <style>
          @page { size: A4; margin: 18mm; }
          body { max-width: 800px; margin: 0 auto; color: #18232d; font: 11.5pt/1.5 Arial, sans-serif; }
          header { border-bottom: 3px solid #0f3554; padding-bottom: 12px; margin-bottom: 22px; }
          h1 { color: #0f3554; font-size: 24pt; margin: 0 0 4px; }
          .meta { color: #5c6872; margin: 0; }
          .case { background: #e8f6eb; border-left: 5px solid #196b2c; padding: 12px 14px; margin: 18px 0; }
          .case strong { display: block; color: #196b2c; margin-bottom: 4px; }
          .entry { break-inside: avoid; border: 1px solid #d7dee3; border-radius: 8px; padding: 13px 15px; margin: 0 0 13px; }
          .entry h2 { color: #0f3554; font-size: 12pt; margin: 0 0 8px; }
          .entry p { white-space: normal; margin: 0; min-height: 1.4em; }
          .status { margin-top: 8px; color: #5c6872; font-weight: bold; font-size: 9.5pt; }
          .hint { margin-top: 20px; color: #5c6872; font-size: 9pt; }
          @media print { .hint { display: none; } }
        </style></head><body>
          <header><h1>${safeHtml(data.title)}</h1><p class="meta">Verarbeitungs-Aufträge · Modul AGS zu FaGe<br>Gespeichert am ${safeHtml(new Date().toLocaleString('de-CH'))}</p></header>
          ${data.caseText ? `<div class="case"><strong>Fallsituation</strong>${safeHtml(data.caseText)}</div>` : ''}
          ${entries}
          <p class="hint">Wählen Sie im Druckfenster „Als PDF speichern“.</p>
        </body></html>`;
    }

    function saveAsPdf(topicId) {
      const data = exportData(topicId);
      const printWindow = window.open('', '_blank');
      if (!printWindow) {
        alert('Das Druckfenster wurde blockiert. Bitte erlauben Sie Pop-ups für diese Seite und versuchen Sie es erneut.');
        return;
      }
      printWindow.document.open();
      printWindow.document.write(printableHtml(data));
      printWindow.document.close();
      printWindow.focus();
      setTimeout(() => printWindow.print(), 250);
    }

    function saveAsText(topicId) {
      const data = exportData(topicId);
      const lines = [
        data.title,
        'Verarbeitungs-Aufträge – Modul AGS zu FaGe',
        `Gespeichert am ${new Date().toLocaleString('de-CH')}`,
        ''
      ];
      if (data.caseText) lines.push('FALLSITUATION', data.caseText, '');
      data.entries.forEach((entry, i) => {
        lines.push(`${i + 1}. ${entry.question}`, `Antwort: ${entry.answer}`);
        if (entry.status) lines.push(`Auswertung: ${entry.status}`);
        lines.push('');
      });
      const blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `${topicId}-antworten.txt`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    document.querySelectorAll('[data-export-pdf]').forEach(el =>
      el.addEventListener('click', () => saveAsPdf(el.dataset.exportPdf))
    );
    document.querySelectorAll('[data-export-text]').forEach(el =>
      el.addEventListener('click', () => saveAsText(el.dataset.exportText))
    );

    function updateProgress() {
      const textAnswers = [...document.querySelectorAll('[data-text-answer]')];
      const anatomy = [...document.querySelectorAll('[data-anatomy]')];
      const total = textAnswers.length + anatomy.length;
      const filled = textAnswers.filter(el => el.value.trim()).length + anatomy.filter(el => el.value).length;
      document.getElementById('progressText').textContent = `${filled} von ${total} Antworten begonnen`;
      document.getElementById('progressBar').style.width = `${total ? filled / total * 100 : 0}%`;
    }

    updateProgress();
    showTopic(activeIndex);
  </script>
</body>
</html>
